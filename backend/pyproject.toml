[project]
name = "debi-dorshon-backend"
version = "0.1.0"
description = "FastAPI Backend & Data Pipeline for Debi-Dorshon Durga Puja Guide App"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "motor>=3.3.2",
    "pymongo>=4.6.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.5",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
    "pillow>=12.3.0",
    "google-auth>=2.28.0",
    "pyjwt>=2.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
