services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: debi_dorshon_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: debi_dorshon_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    env_file:
      - ./backend/.env
    environment:
      - PROJECT_NAME=Debi-Dorshon API
      - API_V1_STR=/api/v1
      - HOST=0.0.0.0
      - PORT=8000
      - MONGODB_URL=${MONGODB_URL:-mongodb://mongodb:27017}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-debi_dorshon_db}
      - PANDAL_COLLECTION_NAME=${PANDAL_COLLECTION_NAME:-pandals}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
